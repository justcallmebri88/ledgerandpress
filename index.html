<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Ledger &amp; Press | Live Personalization Studio in Houston</title>
<meta name="description" content="Ledger &amp; Press is an experiential personalization and event branding studio. Live laser engraving and hot foil stamping for weddings, private celebrations, corporate events, and brand activations in Houston, Dallas, and beyond.">
<style>
@font-face{font-family:'Marcellus';src:url('fonts/Marcellus-Regular.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Marcellus';src:url('fonts/Marcellus-Regular.ttf') format('truetype');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Jost';src:url('fonts/Jost-Light.ttf') format('truetype');font-weight:100 350;font-style:normal;font-display:swap}
@font-face{font-family:'Jost';src:url('fonts/Jost-Light.ttf') format('truetype');font-weight:100 350;font-style:italic;font-display:swap}
@font-face{font-family:'Jost';src:url('fonts/Jost-Variable.ttf') format('truetype');font-weight:351 900;font-style:normal;font-display:swap}
@font-face{font-family:'Great Vibes';src:url('fonts/GreatVibes-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
html{scroll-behavior:smooth;background:#2B0A0E}
body{margin:0;background:#2B0A0E;color:#EFE6D6;font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:#6E1F2A;color:#F5EEE2}
[id]{scroll-margin-top:84px}
a{color:inherit}
img{display:block}
.disp{font-family:'Marcellus',serif;font-weight:400}
.scr{font-family:'Marcellus',serif;font-weight:400;letter-spacing:.03em}
.cap{font-family:'Jost',sans-serif;font-size:12px;font-weight:300;letter-spacing:.3em;text-transform:uppercase}
.gold{color:#EADFCC}
.muted{color:#B9A898}
.ink-dk{color:#2B0A0E}

/* textures */
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80;opacity:.10;mix-blend-mode:overlay}
.velvet{background:radial-gradient(ellipse 70% 60% at 50% 38%,#6A1A22 0%,#4A0F16 38%,#2B0A0E 78%,#1C0609 100%)}
.paper{background-color:#F2EADC;color:#2B0A0E;position:relative}
.paper::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(176,150,110,.18),transparent 60%)}
.paper > *{position:relative}
.rule{display:flex;align-items:center;gap:16px;color:#EADFCC}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:currentColor;opacity:.45}

/* header */
.hdr{position:sticky;top:0;z-index:60;background:rgba(28,6,9,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(244,239,230,.22)}
.hdr-in{max-width:1440px;margin:0 auto;padding:0 40px;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.nav{display:flex;gap:34px;align-items:center}
.nav-r{justify-content:flex-end}
.nav a{text-decoration:none;color:#E6DCCB;padding:14px 0;position:relative;transition:color .3s}
.nav a:hover{color:#EADFCC}
.logo{text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;justify-content:center}
.logo b{font-family:'Marcellus',serif;font-weight:400;font-size:24px;letter-spacing:.12em;color:#F5EEE2}
.logo i{font-family:'Jost',sans-serif;font-style:normal;font-size:10px;color:#EADFCC;letter-spacing:.34em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:50px;padding:0 30px;border:1px solid #EADFCC;background:transparent;color:#F5EEE2;text-decoration:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:background .4s,color .4s}
.btn:hover{background:#EADFCC;color:#2B0A0E}
.btn-solid{background:#EADFCC;color:#2B0A0E}
.btn-solid:hover{background:#F5EEE2;color:#2B0A0E;border-color:#F5EEE2}
.btn-ox{border-color:#6E1F2A;background:#6E1F2A;color:#F5EEE2}
.btn-ox:hover{background:#2B0A0E;border-color:#2B0A0E;color:#F5EEE2}
.btn-sm{min-height:44px;padding:0 20px}

/* hero */
.hero{position:relative;overflow:hidden;padding:0 0 96px;min-height:880px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:56px}
.spot{position:absolute;left:50%;top:6%;width:900px;height:900px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,224,170,.16) 0%,rgba(255,224,170,0) 62%);pointer-events:none}
.hcard-wrap{position:relative;perspective:1200px}
.hcard{width:520px;height:316px;border-radius:12px;position:relative;transform:rotateX(8deg) rotateY(-6deg);transition:transform 1.2s cubic-bezier(.2,.7,.2,1);box-shadow:0 40px 60px -20px rgba(0,0,0,.75),0 16px 24px -12px rgba(0,0,0,.6);animation:float 7s ease-in-out infinite}
.hcard-wrap:hover .hcard{transform:rotateX(0) rotateY(0)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.hcard .face{position:absolute;inset:0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.hcard .bevel{position:absolute;inset:14px;border:1px solid rgba(90,62,24,.35);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,240,200,.5)}
.hcard .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,250,230,.45) 46%,transparent 58%);background-size:260% 100%;animation:shine 6s ease-in-out 1.6s infinite}
@keyframes shine{0%{background-position:120% 0}40%,100%{background-position:-60% 0}}
.hcard-title{font-family:'Marcellus',serif;font-weight:500;font-size:40px;letter-spacing:.16em;color:#6b4a1c;text-shadow:0 1px 0 rgba(255,236,190,.75),0 -1px 0 rgba(60,35,10,.45);position:relative}
.hcard-sub{font-family:'Marcellus',serif;font-size:11px;letter-spacing:.42em;color:#6b4a1c;text-shadow:0 1px 0 rgba(255,236,190,.7);position:relative}
.reveal{clip-path:inset(0 100% 0 0);animation:burn 2.6s cubic-bezier(.6,.1,.4,.9) .8s forwards}
.reveal2{clip-path:inset(0 100% 0 0);animation:burn 1.4s cubic-bezier(.6,.1,.4,.9) 3.2s forwards}
@keyframes burn{to{clip-path:inset(0 0 0 0)}}
.hbeam{position:absolute;top:44%;left:12%;width:10px;height:10px;border-radius:50%;background:#fff3d6;box-shadow:0 0 12px 4px rgba(255,140,60,.9),0 0 34px 10px rgba(255,90,40,.5);opacity:0;animation:hbeam 2.6s cubic-bezier(.6,.1,.4,.9) .8s forwards}
@keyframes hbeam{0%{left:12%;opacity:1}96%{left:86%;opacity:1}100%{left:86%;opacity:0}}

/* hero photo with live mark */
.hshot{position:relative;width:100%;max-width:1440px;aspect-ratio:1680/944;container-type:inline-size;margin-top:-40px;-webkit-mask-image:radial-gradient(ellipse 78% 82% at 50% 44%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 78% 82% at 50% 44%,#000 58%,transparent 100%)}
.hshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease}
.hshot-eng{aspect-ratio:1916/821;max-width:none;margin-top:0;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,#000 72%,transparent 100%)}
.hshot-eng img{animation:heroin 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes heroin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.hshine{position:absolute;left:30%;right:29.8%;top:16.7%;bottom:34.2%;border-radius:1%;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(110deg,transparent 35%,rgba(255,236,190,.42) 48%,transparent 60%);background-size:280% 100%;background-position:130% 0;animation:shine 7s ease-in-out 2.2s infinite}
.on-card{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1cqw}
.pos-gold{left:29.2%;right:29.6%;top:19.9%;bottom:35.4%}
.pos-leather{left:35.9%;right:35.6%;top:18.5%;bottom:30.6%;gap:.2cqw}
.eng-t{font-family:'Marcellus',serif;font-weight:500;font-size:3.05cqw;letter-spacing:.16em;color:#6a4818;text-shadow:0 1px 0 rgba(255,236,190,.7),0 -1px 0 rgba(60,35,10,.45);white-space:nowrap}
.eng-s{font-family:'Marcellus',serif;font-size:.86cqw;letter-spacing:.42em;color:#6a4818;text-shadow:0 1px 0 rgba(255,236,190,.65);white-space:nowrap}
.go .eng-t{animation:burn 2.6s cubic-bezier(.6,.1,.4,.9) .5s both}
.go .eng-s{animation:burn 1.3s cubic-bezier(.6,.1,.4,.9) 3s both}
.hb{position:absolute;top:44%;left:6%;width:.6cqw;height:.6cqw;min-width:6px;min-height:6px;border-radius:50%;background:#fff3d6;box-shadow:0 0 12px 4px rgba(255,140,60,.9),0 0 34px 10px rgba(255,90,40,.5);opacity:0;pointer-events:none}
.go .hb{animation:hb 2.6s cubic-bezier(.6,.1,.4,.9) .5s both,jitter .09s steps(2) infinite}
@keyframes hb{0%{left:6%;opacity:1}96%{left:94%;opacity:1}100%{left:94%;opacity:0}}
.foil-t,.foil-amp{background:linear-gradient(100deg,#8a6a2f 0%,#e9d39b 22%,#b48a45 40%,#f6e7b8 52%,#a37d3e 70%,#e2c88e 100%);background-size:240% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55)) drop-shadow(0 -1px 0 rgba(255,210,170,.12));line-height:1}
.foil-t{font-family:'Marcellus',serif;font-weight:600;font-size:3.4cqw;letter-spacing:.18em;padding-left:.18em}
.foil-amp{font-family:'Marcellus',serif;font-size:3.6cqw;padding:.2cqw 0}
.go .foil-t,.go .foil-amp{animation:foilin 1.8s ease both,foilshine 2.4s ease 1.7s both}
.plate2{position:absolute;inset:6% 4%;border-radius:4px;background:linear-gradient(180deg,#3a2c1c,#1f160d);box-shadow:inset 0 2px 0 rgba(255,220,160,.25),0 30px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:3}
.go .plate2{animation:pressdown 1.8s cubic-bezier(.5,0,.3,1) both}

/* sections */
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sec{padding:140px 0}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;color:#EADFCC}
.orn{width:44px;height:10px}
.h2{font-family:'Marcellus',serif;font-weight:400;font-size:clamp(40px,4.6vw,72px);line-height:1.02;letter-spacing:-.01em;margin:0}
.h2 em{font-family:'Marcellus',serif;font-style:normal;font-size:1em;font-weight:400;letter-spacing:0;color:#EADFCC;padding:0 .04em}
.paper .h2 em{color:#6E1F2A}
.lede{font-size:21px;line-height:1.6;max-width:640px;margin:0 auto}

/* studio intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:96px;align-items:center}
.framed{padding:14px;background:#F8F2E7;border:1px solid rgba(110,31,42,.25);box-shadow:0 30px 50px -30px rgba(43,10,14,.5)}
.framed .in{border:1px solid rgba(244,239,230,.7);padding:10px}
.framed img{width:100%;height:100%;object-fit:cover}

/* experience stepper */
.steps{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:72px;align-items:stretch;margin-top:72px}
.step-list{display:flex;flex-direction:column;border-top:1px solid rgba(244,239,230,.3)}
.step-btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:26px 8px 26px 0;border-bottom:1px solid rgba(244,239,230,.3);transition:background .4s}
.step-btn:hover{background:rgba(244,239,230,.06)}
.step-btn:focus-visible{outline:1px solid #EADFCC;outline-offset:2px}
.step-num{font-family:'Marcellus',serif;font-style:normal;font-size:30px;color:rgba(244,239,230,.55);transition:color .4s}
.step-t{font-family:'Marcellus',serif;font-size:28px;line-height:1.1;color:rgba(239,230,214,.6);transition:color .4s}
.step-d{font-size:18px;line-height:1.55;color:#D9CEC1;max-height:0;overflow:hidden;opacity:0;transition:max-height .7s ease,opacity .5s ease,margin .5s;margin-top:0}
.step-on .step-num{color:#EADFCC}
.step-on .step-t{color:#F5EEE2}
.step-on .step-d{max-height:180px;opacity:1;margin-top:12px}
.step-view{position:relative;min-height:560px;border:1px solid rgba(244,239,230,.35);padding:16px}
.step-view .in{position:absolute;inset:16px;overflow:hidden;background:#1C0609}
.step-view img{width:100%;height:100%;object-fit:cover;filter:brightness(.78) contrast(1.08) saturate(.85) sepia(.12);animation:fadein .9s ease both}
.step-view img.cutout{object-fit:contain;padding:48px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.6))}
@keyframes fadein{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.step-cap{position:absolute;left:32px;bottom:28px;right:32px;display:flex;justify-content:space-between;align-items:flex-end;color:#F5EEE2}

/* the press (interactive) */
.press{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:center;margin-top:72px}
.stage{position:relative;height:560px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,239,230,.3);background:radial-gradient(ellipse 60% 55% at 50% 46%,#5A141C 0%,#2B0A0E 70%,#1C0609 100%);overflow:hidden}
.stage-in{position:relative;display:flex;align-items:center;justify-content:center}
.surf{position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 34px 50px -22px rgba(0,0,0,.8),0 10px 18px -8px rgba(0,0,0,.6);transition:all .5s ease}
.surf .tex{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
.surf-gold{width:460px;height:280px;border-radius:12px;background:linear-gradient(135deg,#8a6a2f 0%,#d9b874 26%,#f3dfa6 44%,#b8914a 60%,#e4c98a 80%,#8f6c30 100%)}
.surf-gold::after,.surf-silver::after{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.04) 1px 3px)}
.surf-silver{width:460px;height:280px;border-radius:12px;background:linear-gradient(135deg,#7d8186 0%,#cfd3d7 28%,#f2f4f5 44%,#9fa4a9 60%,#d9dcdf 80%,#80858a 100%)}
.surf-cognac,.surf-black{width:204px;height:341px;margin-top:174px;box-shadow:none;background:none;padding-top:40px}
.surf-cognac::before,.surf-black::before{content:'';position:absolute;left:0;top:-174px;width:204px;height:515px;background:url('images/tag-cognac.png') center/100% 100% no-repeat;filter:drop-shadow(0 28px 22px rgba(0,0,0,.6));z-index:0}
.surf-black::before{background-image:url('images/tag-black.png')}
.mark.on-cognac,.mark.on-black{max-width:82%}
.on-cognac.face-classic,.on-black.face-classic{font-size:26px}
.on-cognac.face-modern,.on-black.face-modern{font-size:17px}
.on-cognac.face-script,.on-black.face-script{font-size:40px}
.on-cognac .logo-t,.on-black .logo-t{font-size:15px}
.on-cognac .shape-top,.on-black .shape-top{font-size:20px;margin-bottom:8px}

.surf-walnut{width:400px;height:370px;border-radius:0;background:url('images/walnut-board.png') center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 30px 26px rgba(0,0,0,.6));padding-left:14px}
.surf-ivory{width:460px;height:280px;border-radius:2px;background:#F1ECDD url('images/ivory-linen-card.jpg') center/cover no-repeat;box-shadow:0 34px 50px -22px rgba(0,0,0,.8),0 2px 3px rgba(0,0,0,.25)}
.surf-lemon{width:400px;height:290px;border-radius:50%;background:radial-gradient(ellipse at 38% 32%,#fff6a8 0%,#f7dc3e 32%,#e9c21c 64%,#c79a0e 100%)}
.surf-lemon::before{content:'';position:absolute;left:-18px;top:50%;width:40px;height:30px;border-radius:50%;transform:translateY(-50%);background:radial-gradient(#e9c21c,#c79a0e)}
.surf-lemon::after{content:'';position:absolute;right:-18px;top:50%;width:40px;height:30px;border-radius:50%;transform:translateY(-50%);background:radial-gradient(#e9c21c,#c79a0e)}
.mark{position:relative;z-index:2;max-width:86%;text-align:center;line-height:1.1;word-break:break-word}
.face-classic{font-family:'Marcellus',serif;font-size:44px;letter-spacing:.06em}
.face-modern{font-family:'Jost',sans-serif;font-weight:300;font-size:34px;letter-spacing:.24em;text-transform:uppercase}
.surf-key,.surf-skey{width:400px;height:238px;margin-left:179px;box-shadow:none;background:none}
.surf-key::before,.surf-skey::before{content:'';position:absolute;left:-179px;top:0;width:579px;height:238px;background:url('images/keychain-gold.png') center/100% 100% no-repeat;filter:drop-shadow(0 26px 22px rgba(0,0,0,.55));z-index:0}
.surf-skey::before{background-image:url('images/keychain-silver.png')}
.on-key .ink{color:#6b4a1c;text-shadow:0 1px 0 rgba(255,236,190,.75),0 -1px 0 rgba(60,35,10,.5)}
.on-skey .ink{color:#4a4e52;text-shadow:0 1px 0 rgba(255,255,255,.8),0 -1px 0 rgba(0,0,0,.4)}
.mark.on-key,.mark.on-skey{max-width:80%;margin-left:38px}
.mark{text-wrap:balance}
.face-classic .ink:not(.shape){padding-left:.06em}
.face-modern .ink:not(.shape){padding-left:.24em}
.foil.on-cognac:not(.fc-deboss) .ink{filter:drop-shadow(0 1px 1px rgba(40,14,4,.85))}
@media (max-width: 820px){.stage-in:has(.surf-key),.stage-in:has(.surf-skey){transform:scale(.56)}}
.on-key.face-classic,.on-skey.face-classic{font-size:36px}
.on-key.face-modern,.on-skey.face-modern{font-size:26px}
.on-key.face-script,.on-skey.face-script{font-size:54px}
.on-key .logo-t,.on-skey .logo-t{font-size:22px}
.on-key .shape-top,.on-skey .shape-top{font-size:24px;margin-bottom:10px}
.face-script{font-family:'Great Vibes',cursive;font-size:62px;letter-spacing:0;line-height:1.15}
.mark .ink{display:block}
.mark .shape{font-family:'Apple Symbols','Segoe UI Symbol','DejaVu Sans',sans-serif;font-size:40px;line-height:1;letter-spacing:0;text-transform:none;margin-top:14px;font-weight:400}
.mark .shape-top{margin:0 0 14px;font-size:30px}
.mark .logo-t{font-family:'Jost',sans-serif;font-weight:400;font-size:30px;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;line-height:1.2}
.on-gold .ink{color:#6b4a1c;text-shadow:0 1px 0 rgba(255,236,190,.75),0 -1px 0 rgba(60,35,10,.5)}
.on-silver .ink{color:#4d5155;text-shadow:0 1px 0 rgba(255,255,255,.8),0 -1px 0 rgba(0,0,0,.4)}
.laser.on-cognac .ink{color:#3a1a0a;text-shadow:0 0 1px rgba(20,8,2,.7),0 1px 0 rgba(255,210,170,.15)}
.laser.on-walnut .ink{color:#1c0e07;text-shadow:0 0 2px rgba(0,0,0,.55),0 1px 0 rgba(255,220,180,.18)}
.laser.on-lemon .ink{color:#6b4512;opacity:.88;text-shadow:0 0 1px rgba(80,50,10,.4)}
.foil .ink{background:linear-gradient(100deg,#8a6a2f 0%,#e9d39b 22%,#b48a45 40%,#f6e7b8 52%,#a37d3e 70%,#e2c88e 100%);background-size:240% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.foil.fc-silver .ink{background-image:linear-gradient(100deg,#7d8186 0%,#f2f4f5 22%,#a2a7ac 40%,#ffffff 52%,#8c9196 70%,#dfe2e5 100%)}
.foil.on-ivory .ink{filter:drop-shadow(0 1px 0 rgba(120,90,50,.35))}
.foil.fc-deboss .ink{background:none;-webkit-background-clip:border-box;background-clip:border-box;filter:none}
.foil.fc-deboss.on-black .ink{color:#120d0d;text-shadow:0 1px 0 rgba(255,255,255,.14),0 -1px 1px rgba(0,0,0,.8)}
.foil.fc-deboss.on-cognac .ink{color:#6e3c1d;text-shadow:0 1px 0 rgba(255,214,176,.3),0 -1px 1px rgba(40,14,4,.65)}
.foil.fc-deboss.on-ivory .ink{color:#E2DAC6;text-shadow:0 1px 0 rgba(255,255,255,.95),0 -1px 1px rgba(90,70,40,.45)}
.go.laser .ink{animation:burn 2.4s linear both}
.beam{position:absolute;z-index:3;top:50%;left:7%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff3d6;box-shadow:0 0 12px 4px rgba(255,140,60,.95),0 0 36px 12px rgba(255,90,40,.5);opacity:0;pointer-events:none}
.go.laser .beam{animation:beam 2.4s linear both,jitter .09s steps(2) infinite}

.svc{border-top:1px solid rgba(42,11,15,.14)}
.svc-i{border-right-color:rgba(42,11,15,.1)}
.svc-n{color:#7A2230}
.logo-img{height:21px;width:auto;display:block}
/* services: what we do */
.svc-eyebrow{font-size:14px;letter-spacing:.32em;color:#7A2230}
.svc{border-top:0;gap:24px}
.svc-i,.svc-i:last-child{background:#F8F4EC;border:1px solid rgba(61,16,22,.16);padding:44px 36px 40px;gap:16px;transition:border-color .3s,transform .3s,box-shadow .3s}
.svc-i:hover{border-color:#3D1016;transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(61,16,22,.5)}
.svc-ic{width:68px;height:68px;border-radius:50%;background:#3D1016;color:#F4EFE6;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.gal .ga{grid-column:1/7;grid-row:1/10}
.gal .gb{grid-column:7/13;grid-row:1/6}
.gal .gc{grid-column:7/13;grid-row:6/10}
.gal .gd{grid-column:1/5;grid-row:10/18}
.gal .ge{grid-column:5/13;grid-row:10/14}
.gal .gf{grid-column:5/9;grid-row:14/18}
.gal .gg{grid-column:9/13;grid-row:14/18}
@media (max-width: 820px){.gal .g{grid-column:1/-1;grid-row:auto;aspect-ratio:4/3}.gal .gd,.gal .gg{aspect-ratio:4/5}}
/* hero: one centered group on full-height paper (mark, headline, subtitle, buttons) */
.hero .foil-hero{height:calc(100vh - 84px);height:calc(100svh - 84px);min-height:620px;max-height:900px;background:#EFE8DC url('images/hero-paper.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;padding-bottom:2vh}
.hero .foil-hero .hero-mark{display:block;position:static;inset:auto;width:clamp(340px,68vw,1180px);max-width:92vw;height:auto;aspect-ratio:auto;object-fit:contain;-webkit-mask-image:none;mask-image:none;margin:0 0 clamp(22px,2.6vw,40px);animation:heroimgin 1.4s ease both}
.hero .foil-copy #hero-h{margin:0 0 18px !important}
.nav a{white-space:nowrap}
@media (max-width: 1360px) and (min-width: 821px){.nav{gap:22px}.nav-l.cap{letter-spacing:.18em;font-size:11px}}
@media (max-width: 1140px) and (min-width: 821px){.nav{gap:14px}.nav-l.cap{letter-spacing:.12em}.logo-img{height:16px}.hdr-in{padding:0 20px}}
.hero .foil-copy .foil-sub{margin:0 0 34px !important}
.hero .foil-copy > div{margin-top:0 !important}
@keyframes heroimgin{from{opacity:0}to{opacity:1}}
.hero .foil-copy{position:relative;inset:auto;top:auto;left:auto;right:auto;padding:0 24px;gap:0;max-width:1100px}
@media (max-width: 820px){.hero{padding:0 !important}.hero .foil-hero{height:auto;min-height:0;max-height:none;padding:64px 0 80px}.hero .foil-hero .hero-mark{width:94vw}.hero .foil-copy{padding:0 16px}}
.svc-ph{margin:-44px -36px 10px;aspect-ratio:4/3;overflow:hidden;background:#3D1016}
.svc-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.svc-i:hover .svc-ph img{transform:scale(1.04)}
@media (max-width: 820px){.svc-ph{margin:-32px -24px 8px}}
.lede{text-wrap:balance}
.svc-k{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7A2230}
.svc-t{font-size:clamp(30px,2.6vw,38px);color:#2A0B0F}
.svc-d{flex:1}
.svc-go{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;min-height:48px;margin-top:8px;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#3D1016;text-decoration:none;border-bottom:1.5px solid #3D1016}
.svc-go span{transition:transform .3s}
.svc-go:hover span{transform:translateX(5px)}
@media (max-width: 820px){.svc{gap:16px}.svc-i,.svc-i:last-child{padding:32px 24px;border:1px solid rgba(61,16,22,.16)}}
@media (prefers-reduced-motion: reduce){.svc-i:hover{transform:none}}
@media (max-width: 820px){.logo-img{height:15px}}

/* accessibility (WCAG 2.1 AA) */
.skip{position:absolute;left:16px;top:-80px;z-index:100;padding:14px 22px;background:#F4EFE6;color:#2A0B0F;font-family:'Jost',sans-serif;font-size:16px;text-decoration:none;border:2px solid #2A0B0F}
.skip:focus{top:16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #F4EFE6 !important;outline-offset:3px !important}
.paper a:focus-visible,.paper button:focus-visible,.paper input:focus-visible,.paper select:focus-visible,.paper textarea:focus-visible,.paper [tabindex]:focus-visible,.hero a:focus-visible,.hero button:focus-visible{outline-color:#3D1016 !important}
.step-view a:focus-visible,.step-view button:focus-visible{outline-color:#F4EFE6 !important}
.chip:focus-within{outline:2px solid #3D1016;outline-offset:3px}
#experience .step-num{color:rgba(61,16,22,.65)}
#experience .step-t{color:rgba(61,16,22,.82);font-size:32px;-webkit-text-stroke:.4px currentColor}
#experience .step-d{color:#2E1F1A;font-weight:400;font-size:19px}
#experience .step-num{color:rgba(61,16,22,.75);-webkit-text-stroke:.3px currentColor}
#experience .step-on .step-num{color:#7A2230}
#experience .step-on .step-t{color:#3D1016}
#experience .steps{display:block}
.step-row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
.ftr-legal{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 28px;padding-top:16px;padding-bottom:28px;border-top:1px solid rgba(244,239,230,.12);font-size:11px;font-weight:300;letter-spacing:.24em;text-transform:uppercase;color:rgba(234,223,204,.75)}
.ftr-legal nav{display:flex;flex-wrap:wrap;gap:0 28px}
.ftr-legal a{color:#EADFCC;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-legal a:hover{text-decoration:underline}
.step-item{display:flex;flex-direction:column;gap:12px;padding-top:28px;border-top:1px solid rgba(61,16,22,.2)}
#experience .step-item .step-d{max-height:none;opacity:1;margin-top:0;overflow:visible}
@media (max-width: 1080px){.step-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 40px}}
@media (max-width: 820px){.step-row{grid-template-columns:1fr;gap:36px}}
/* rounded buttons */
.btn,.btn-sm,.opt,.chip{border-radius:999px}
.svc-go{border-radius:0}
/* what we do: bigger and bolder */
.svc-eyebrow{font-size:17px;font-weight:500;letter-spacing:.3em}
#svc-h{font-size:clamp(52px,6.4vw,104px) !important}
#services .lede{font-size:23px;font-weight:400;color:#2E1F1A !important}
.svc-t{font-size:clamp(34px,3vw,46px)}
.svc-k{font-size:14px;font-weight:500}
.svc-d{font-size:21px;font-weight:400;color:#2E1F1A;line-height:1.6}
.svc-go{font-size:14px;font-weight:500}
.svc-i,.svc-i:last-child{padding:48px 40px 44px;gap:18px}
.svc-ph{margin:-48px -40px 12px}
@media (max-width: 820px){.svc-ph{margin:-32px -24px 8px}}
.fld input,.fld select{border-bottom-color:rgba(43,10,14,.6)}
.fld textarea,.chip{border-color:rgba(43,10,14,.6)}
.namein{border-bottom-color:rgba(244,239,230,.55)}
.opt{border-color:rgba(244,239,230,.55)}
.step-cap .cap{background:rgba(42,11,15,.82);color:#F4EFE6;padding:10px 14px}
.step-cap .btn{background:#2A0B0F;border-color:#F4EFE6}
.req-note{margin:0 0 28px;font-size:16px;line-height:1.5;color:#4A3A32}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}.beam,.hb,.hbeam,.plate,.smoke{display:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div id="top" class="velvet" style="color: #EFE6D6; font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; position: relative">
  <a href="#main" class="skip">Skip to main content</a>

  
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><filter id="lp-pebble"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"></feTurbulence><feDiffuseLighting lighting-color="#ffffff" surfaceScale="1.6"><feDistantLight azimuth="225" elevation="55"></feDistantLight></feDiffuseLighting></filter></svg>

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-in">
      <nav class="nav nav-l cap" aria-label="Primary">
        <a href="#studio">The Studio</a>
        <a href="#experience">The Experience</a>
        <a href="#press">Try the Press</a>
        <a href="#work">Work</a>
      </nav>
      <a href="#top" class="logo" aria-label="Ledger &amp; Press, back to top"><img class="logo-img" src="images/logo-cream.png" alt=""></a>
      <div class="nav nav-r cap">
        <a href="#inquire" class="btn btn-sm">Inquire</a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1" style="position: relative; outline: none">
    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-h">
      <div class="hero-wrap">
        <figure class="foil-hero">
          
          <figcaption class="foil-copy">
            <img class="hero-mark" src="images/hero-foil-mark.png" alt="Ledger &amp; Press, hot foil stamped in gold on cream cotton paper">
          <h1 id="hero-h" class="disp" style="margin: 0; font-size: clamp(24px, 2.5vw, 38px); line-height: 1.12; letter-spacing: -.01em; color: #3D1016">Experiential Personalization &amp; Event Branding Studio</h1>
            <p class="foil-sub" style="margin: 0; font-size: clamp(19px, 1.7vw, 24px); line-height: 1.55; max-width: 680px; color: #2A1A16">Live personalization, custom event branding, and creative production for brands, artists, and private celebrations.</p>
            <div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 6px">
              <a href="#inquire" class="btn btn-ox">Inquire about your event</a>
              <a href="#press" class="btn btn-line">Try the press</a>
            </div>
          </figcaption>
        </figure>
      </div>
    </section>

    <!-- STUDIO -->
    <section id="studio" class="sec" aria-labelledby="studio-h" style="background: #1C0609; color: #F4EFE6">
      <div class="wrap intro">
        <div class="rv" style="display: flex; flex-direction: column; gap: 32px">
          <div class="rule cap" style="color: #EADFCC; max-width: 260px">The Studio</div>
          <h2 id="studio-h" class="h2">The art of the <em>personal mark.</em></h2>
          <p style="margin: 0; font-size: 21px; line-height: 1.65; color: #D9CEC1">Ledger &amp; Press is an experiential personalization studio devoted to laser engraving and hot foil stamping. Our craft extends to nearly any surface, from fine leather and polished gold to raw denim and fresh citrus.</p>
          <p style="margin: 0; font-size: 21px; line-height: 1.65; color: #D9CEC1">The studio travels to private celebrations, weddings, corporate gatherings, and brand activations, where each piece is personalized in the presence of your guests. Private commissions are welcomed and realized entirely within our studio.</p>
          <p style="margin: 0; font-size: 21px; line-height: 1.65; color: #D9CEC1">We proudly serve Houston, Dallas, and Beyond.</p>
          <p class="scr" style="margin: 8px 0 0; font-size: 40px; color: #EADFCC">Ledger &amp; Press</p>
        </div>
        <div class="framed rv" style="aspect-ratio: 1202 / 1160">
          <div class="in" style="height: 100%"><img style="object-fit: contain; filter: drop-shadow(0 30px 30px rgba(0,0,0,.45))" src="images/mobile-station.png" alt="The Ledger &amp; Press mobile station: a white panelled bar on casters with the arched L|P Live Personalization display"></div>
        </div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section id="experience" class="paper sec" aria-labelledby="exp-h">
      <div class="wrap">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
          <svg class="orn gold" viewBox="0 0 44 10" aria-hidden="true" style="width: 88px; height: 20px"><path d="M0 5h16M28 5h16" stroke="currentColor"></path><path d="M22 1l4 4-4 4-4-4z" fill="none" stroke="currentColor"></path></svg>
          <h2 id="exp-h" class="h2" style="color: #3D1016; font-size: clamp(64px, 9vw, 152px); line-height: .95">The <em>Experience</em></h2>
          <p class="lede" style="color: #2E1F1A; font-weight: 400">From the first selection to the moment a guest holds their finished piece, every step is designed to be part of the celebration.</p>
        </div>
        <div class="steps">
          <ol class="step-row" aria-label="The experience, step by step">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
              <li class="step-item step-on">
                <span class="step-num">{{s.num}}</span>
                <span class="step-t">{{s.title}}</span>
                <span class="step-d">{{s.text}}</span>
              </li>
            </sc-for>
          </ol>
        </div>
      </div>
    </section>

    <!-- THE PRESS (interactive) -->
    <section id="press" class="sec velvet" aria-labelledby="press-h" style="background: #2B0A0E">
      <div class="wrap">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
          <div class="eyebrow cap"><svg class="orn" viewBox="0 0 44 10" aria-hidden="true"><path d="M0 5h16M28 5h16" stroke="currentColor"></path><path d="M22 1l4 4-4 4-4-4z" fill="none" stroke="currentColor"></path></svg>Try the Press<svg class="orn" viewBox="0 0 44 10" aria-hidden="true"><path d="M0 5h16M28 5h16" stroke="currentColor"></path><path d="M22 1l4 4-4 4-4-4z" fill="none" stroke="currentColor"></path></svg></div>
          <h2 id="press-h" class="h2" style="color: #F5EEE2">Step up to <em>the station.</em></h2>
          <p class="lede" style="color: #D9CEC1">Type a name, choose a method and a surface, and watch it marked the way your guests will see it at your event.</p>
        </div>
        <div class="press">
          <div class="stage" role="img" aria-label="{{stageAlt}}">
            <div class="stage-in">
              <div class="{{surfCls}}">
                <svg class="tex" width="100%" height="100%" aria-hidden="true" style="{{texStyle}}"><rect width="100%" height="100%" filter="url(#lp-pebble)"></rect></svg>
                <div class="smoke {{goCls}}" aria-hidden="true"></div>
                <div class="{{markCls}}">
                  <sc-if value="{{isLogo}}" hint-placeholder-val="{{false}}"><span class="ink shape shape-top" aria-hidden="true">✦</span></sc-if>
                  <span class="{{inkCls}}">{{displayName}}</span>
                  <sc-if value="{{hasShape}}" hint-placeholder-val="{{false}}"><span class="ink shape" aria-hidden="true">{{shapeGlyph}}</span></sc-if>
                  <span class="beam" aria-hidden="true"></span>
                </div>
                <div class="{{plateCls}}" aria-hidden="true"></div>
              </div>
            </div>
            <span class="cap gold" style="position: absolute; left: 24px; bottom: 20px">{{stageLabel}}</span>
          </div>

          <div class="panel">
            <div class="ctl">
              <label for="p-name">Your name or initials</label>
              <input id="p-name" class="namein" type="text" value="{{name}}" onChange="{{onName}}" placeholder="Your name" autocomplete="off" maxlength="18" aria-describedby="p-name-hint">
              <span id="p-name-hint" class="sr-only">Up to 18 characters. The preview updates as you type.</span>
            </div>
            <div class="ctl" role="group" aria-label="Method">
              <span class="legend">Method</span>
              <div class="opts">
                <sc-for list="{{methods}}" as="o" hint-placeholder-count="2">
                  <button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div class="ctl" role="group" aria-label="Surface">
              <span class="legend">Surface</span>
              <div class="opts">
                <sc-for list="{{surfaces}}" as="o" hint-placeholder-count="4">
                  <button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}"><span class="sw" style="{{o.sw}}"></span>{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <sc-if value="{{isFoil}}" hint-placeholder-val="{{false}}">
              <div class="ctl" role="group" aria-label="Finish">
                <span class="legend">Finish</span>
                <div class="opts">
                  <sc-for list="{{foils}}" as="o" hint-placeholder-count="2">
                    <button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}"><span class="sw" style="{{o.sw}}"></span>{{o.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
            <div class="ctl" role="group" aria-label="Design">
              <span class="legend">Design</span>
              <div class="opts">
                <sc-for list="{{designs}}" as="o" hint-placeholder-count="2">
                  <button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button>
                </sc-for>
              </div>
            </div>
            <div class="ctl" role="group" aria-label="Typeface">
              <span class="legend">Typeface</span>
              <div class="opts">
                <sc-for list="{{faces}}" as="o" hint-placeholder-count="3">
                  <button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}"><span style="{{o.fs}}">{{o.label}}</span></button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
              <button type="button" class="btn btn-solid" onClick="{{play}}">{{playLabel}}</button>
              <a href="#inquire" class="btn">Book the station</a>
            </div>
            <p class="note">A preview of the real thing. At your event, every piece is marked live on our station, and we can source nearly any material you have in mind.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="paper sec" aria-labelledby="svc-h">
      <div class="wrap">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
          <div class="cap svc-eyebrow">What We Do</div>
          <h2 id="svc-h" class="h2" style="font-size: clamp(44px, 5.4vw, 88px)">At your event <em>and beyond.</em></h2>
          <p class="lede" style="color: #4A3A32">Choose the experience that fits your occasion and we will take it from there.</p>
        </div>
        <div class="svc">
          <article class="svc-i rv">
            <figure class="svc-ph"><img src="images/live-at-your-event.jpg" alt="Bri at The Engraving Bar taking guest requests beside the laser engraver and Forty Proof gift bags" style="object-position: 40% 50%"></figure>
            <span class="svc-k">Most booked</span>
            <h3 class="svc-t">Live at your event</h3>
            <p class="svc-d">Our workbench travels to private celebrations, weddings, corporate gatherings, and brand activations, where each piece is personalized in the presence of your guests.</p>
            <a href="#inquire" class="svc-go" onClick="{{book.live}}">Book a live station<span aria-hidden="true">&rarr;</span></a>
          </article>
          <article class="svc-i rv">
            <figure class="svc-ph"><img src="images/forty-proof-citrus.jpg" alt="Citrus peels laser engraved with the Forty Proof logo" style="object-position: 50% 55%"></figure>
            <span class="svc-k">For brands</span>
            <h3 class="svc-t">Production for brands</h3>
            <p class="svc-d">From editorial photoshoots to bespoke client gifting, we engrave and foil stamp branded pieces in our studio, ready for your campaign.</p>
            <a href="#inquire" class="svc-go" onClick="{{book.brand}}">Plan a brand project<span aria-hidden="true">&rarr;</span></a>
          </article>
          <article class="svc-i rv">
            <figure class="svc-ph"><img src="images/commission-photo-pendant.jpg" alt="A round silver pendant engraved with a family photograph" style="object-position: 50% 50%"></figure>
            <span class="svc-k">One of a kind</span>
            <h3 class="svc-t">Private commissions</h3>
            <p class="svc-d">One-of-a-kind pieces developed alongside you, carried from first sketch to finished object within our studio.</p>
            <a href="#inquire" class="svc-go" onClick="{{book.creative}}">Start a commission<span aria-hidden="true">&rarr;</span></a>
          </article>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 64px; text-align: center">
          <p style="margin: 0; font-family: 'Marcellus', serif; font-size: clamp(22px, 2vw, 28px); line-height: 1.4; color: #3D1016; text-wrap: balance"><a href="https://www.etsy.com/shop/LedgerAndPress" target="_blank" rel="noopener" style="color: #3D1016; text-underline-offset: 6px; text-decoration-thickness: 1.5px">Selected pieces from our collections may also be acquired online<span class="sr-only"> on Etsy (opens in a new tab)</span></a>.</p>
        </div>
      </div>
    </section>

    <!-- WORK -->
    <section id="work" class="sec" style="background: #3D1016" aria-labelledby="work-h">
      <div class="wrap">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
          <div class="eyebrow cap"><svg class="orn" viewBox="0 0 44 10" aria-hidden="true"><path d="M0 5h16M28 5h16" stroke="currentColor"></path><path d="M22 1l4 4-4 4-4-4z" fill="none" stroke="currentColor"></path></svg>Selected Work<svg class="orn" viewBox="0 0 44 10" aria-hidden="true"><path d="M0 5h16M28 5h16" stroke="currentColor"></path><path d="M22 1l4 4-4 4-4-4z" fill="none" stroke="currentColor"></path></svg></div>
          <h2 id="work-h" class="h2" style="color: #F5EEE2">From <em>the studio.</em></h2>
        </div>
        <div class="gal">
          <figure class="g ga rv" style="margin: 0"><div class="in"><img src="images/necklace-on-bust.jpg" alt="Engraved bar necklace on a black bust beside personalized bracelets" style="object-position: 25% 50%"></div></figure>
          <figure class="g gb rv" style="margin: 0"><div class="in"><img src="images/forty-proof-guest.jpg" alt="A guest at The Engraving Bar with 40 Proof branded gift bags" style="object-position: 60% 45%"></div></figure>
          <figure class="g gc rv" style="margin: 0"><div class="in"><img src="images/monogram-napkins.jpg" alt="A custom monogram stamp on cocktail napkins" style="object-position: 50% 40%"></div></figure>

    var el = ev.target;
    while (el && el !== app) {
      var id = el.getAttribute && el.getAttribute('data-on-' + type);
      if (id != null) { var fn = handlers[+id]; if (fn) fn(ev); return; }
      el = el.parentNode;
    }
  }
  function isToggle(t) { return t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT'; }
  app.addEventListener('click', function (e) { fire(e, 'click'); });
  app.addEventListener('input', function (e) { if (!isToggle(e.target)) fire(e, 'change'); });
  app.addEventListener('change', function (e) { if (isToggle(e.target)) fire(e, 'change'); });
  app.addEventListener('submit', function (e) { fire(e, 'submit'); });

  var comp, queued = false;
  function render() {
    queued = false;
    handlers = [];
    var vals = comp.renderVals();
    var wrap = document.createElement('div');
    tpl.content.childNodes.forEach(function (n) { renderNode(n, [vals]).forEach(function (r) { wrap.appendChild(r); }); });
    morphdom(app, wrap, { childrenOnly: true });
  }
  window.DCLogic = function DCLogic() { this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (!queued) { queued = true; Promise.resolve().then(render); }
  };
  window.__bootSite = function (Component) {
    comp = new Component();
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();
</script>
<script>

class Component extends DCLogic {
  state = {
    name: 'Ledger & Press',
    method: 'laser',
    surface: 'key',
    foil: 'gold',
    face: 'classic',
    design: 'name',
    go: false,
    hero: 'gold',
    heroGo: true,
    tx: -0.18,
    ty: 0.12,
    step: 0,
    form: { name: '', email: '', date: '', location: '', type: '', guests: '', budget: '', project: '' },
    picked: [],
    tried: false,
    sent: false,
    sending: false,
    sendFailed: false
  };

  componentDidMount() {
    this.t = setTimeout(() => this.setState({ go: true }), 500);
  }
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.t2); clearTimeout(this.t3); }

  heroTo(id) {
    clearTimeout(this.t3);
    this.setState({ hero: id, heroGo: false });
    this.t3 = setTimeout(() => this.setState({ heroGo: true }), 60);
  }

  replay(patch) {
    clearTimeout(this.t2);
    this.setState(Object.assign({ go: false }, patch || {}));
    this.t2 = setTimeout(() => this.setState({ go: true }), 40);
  }

  validate() {
    const f = this.state.form;
    const e = {};
    if (!this.state.picked.length) e.services = 'Choose at least one service.';
    if (!f.name.trim()) e.name = 'Please share your name.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) e.email = 'Please enter a valid email address.';
    if (!f.date) e.date = 'Please add your event date.';
    if (!f.location.trim()) e.location = 'Please add the city or location.';
    if (!f.type.trim()) e.type = 'Please describe the type of event.';
    if (!f.guests || Number(f.guests) < 1) e.guests = 'Please estimate your guest count.';
    if (f.project.trim().length < 10) e.project = 'Tell us a little more about your project.';
    return e;
  }

  renderVals() {
    const st = this.state;

    // experience steps
    const STEPS = [
      { num: 'I.', title: 'Select your pieces', text: 'Choose one to three pieces from our collections to offer your guests. A focused selection makes the moment more memorable.', src: 'images/experience-pieces.jpg', alt: 'A foil stamped leather passport cover, an embossed luggage tag, an engraved keychain with a photo charm, and an initial necklace', cut: false },
      { num: 'II.', title: 'Choose your marks', text: 'Select two typefaces from our engraving menu.', src: 'images/hot-foil-holder.jpg', alt: 'Brass type set in the hot foil holder beside a roll of gold foil', cut: false },
      { num: 'III.', title: 'We arrive ready', text: 'Our mobile station rolls into your venue with its front panel and display shelf customized for your event, and is ready for guests within the hour.', src: 'images/cart-cutout.webp', alt: 'The Ledger &amp; Press mobile cart with its arched display', cut: true },
      { num: 'IV.', title: 'The mark is made', text: 'Guests watch their piece personalized live, then carry it home that night as a keepsake from your celebration.', src: 'images/bri-at-the-engraving-bar.jpg', alt: 'Bri personalizing pieces for guests at an event', cut: false }
    ];
    const steps = STEPS.map((s, i) => ({
      num: s.num, title: s.title, text: s.text,
      on: st.step === i,
      cls: st.step === i ? 'step-btn step-on' : 'step-btn',
      pick: () => this.setState({ step: i })
    }));
    const cur = STEPS[st.step];
    const stepImg = [{ src: cur.src, alt: cur.alt.replace('&amp;', '&'), cls: cur.cut ? 'cutout' : '' }];
    const roman = ['I', 'II', 'III', 'IV'];

    // the press
    const LASER_SURF = [
      { id: 'key', label: 'Gold keychain', sw: 'background:linear-gradient(135deg,#c29a50,#f3dfa6,#94703a)' },
      { id: 'skey', label: 'Silver keychain', sw: 'background:linear-gradient(135deg,#80858a,#f2f4f5,#80858a)' },
      { id: 'cognac', label: 'Leather tag', sw: 'background:#8a4a24' },
      { id: 'walnut', label: 'Walnut board', sw: 'background:#6a4a35' }
    ];
    const FOIL_SURF = [
      { id: 'black', label: 'Black leather tag', sw: 'background:#221818' },
      { id: 'cognac', label: 'Cognac leather tag', sw: 'background:#8a4a24' },
      { id: 'ivory', label: 'Ivory card', sw: 'background:#EFE6D6' }
    ];
    const isFoil = st.method === 'foil';
    const surfList = isFoil ? FOIL_SURF : LASER_SURF;
    const surface = surfList.some((s) => s.id === st.surface) ? st.surface : surfList[0].id;

    const methods = [
      { id: 'laser', label: 'Laser engraving' },
      { id: 'foil', label: 'Hot foil stamping' }
    ].map((m) => ({
      label: m.label, on: st.method === m.id,
      cls: st.method === m.id ? 'opt opt-on' : 'opt',
      pick: () => this.replay({ method: m.id, surface: m.id === 'foil' ? 'black' : 'key' })
    }));
    const surfaces = surfList.map((s) => ({
      label: s.label, sw: s.sw, on: surface === s.id,
      cls: surface === s.id ? 'opt opt-on' : 'opt',
      pick: () => this.replay({ surface: s.id })
    }));
    const foils = [
      { id: 'gold', label: 'Gold', sw: 'background:linear-gradient(135deg,#b8914a,#f3dfa6,#8f6c30)' },
      { id: 'silver', label: 'Silver', sw: 'background:linear-gradient(135deg,#80858a,#f2f4f5,#80858a)' },
      { id: 'deboss', label: 'Debossed', sw: 'background:transparent;box-shadow:inset 0 1px 2px rgba(0,0,0,.6),inset 0 0 0 1px rgba(244,239,230,.5)' }
    ].map((f) => ({
      label: f.label, sw: f.sw, on: st.foil === f.id,
      cls: st.foil === f.id ? 'opt opt-on' : 'opt',
      pick: () => this.replay({ foil: f.id })
    }));
    const faces = [
      { id: 'classic', label: 'Marcellus', fs: "font-family:'Marcellus',serif;letter-spacing:.06em" },
      { id: 'modern', label: 'Jost', fs: "font-family:'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase" },
      { id: 'script', label: 'Script', fs: "font-family:'Great Vibes',cursive;font-size:24px;letter-spacing:0" }
    ].map((f) => ({
      label: f.label, fs: f.fs, on: st.face === f.id,
      cls: st.face === f.id ? 'opt opt-on' : 'opt',
      pick: () => this.replay({ face: f.id })
    }));

    const designs = [
      { id: 'name', label: 'Name' },
      { id: 'logo', label: 'Your logo' }
    ].map((d) => ({
      label: d.label, on: st.design === d.id,
      cls: st.design === d.id ? 'opt opt-on' : 'opt',
      pick: () => this.replay({ design: d.id })
    }));
    const isLogo = st.design === 'logo';
    const shapeGlyph = st.design === 'heart' ? '♥︎' : (st.design === 'star' ? '★︎' : '');
    const faceName = { classic: 'Marcellus', modern: 'Jost', script: 'Script' }[st.face];
    const goCls = st.go ? 'go' : '';
    const leather = surface === 'cognac' || surface === 'black';
    const markCls = ['mark', st.method, 'on-' + surface, 'face-' + st.face, isFoil ? 'fc-' + st.foil : '', goCls].join(' ');
    const surfLabel = surfList.find((s) => s.id === surface).label;

    // form
    const set = (k) => (ev) => this.setState({ form: { ...this.state.form, [k]: ev.target.value } });
    const on = {};
    Object.keys(st.form).forEach((k) => { on[k] = set(k); });
    const list = [
      { id: 'live', label: 'Live Personalization' },
      { id: 'brand', label: 'Event Branding & Production' },
      { id: 'creative', label: 'Creative Direction & Fabrication' }
    ];
    const services = list.map((s) => {
      const checked = st.picked.indexOf(s.id) !== -1;
      return {
        ...s, checked,
        cls: checked ? 'chip chip-on' : 'chip',
        toggle: () => {
          const p = this.state.picked;
          this.setState({ picked: p.indexOf(s.id) !== -1 ? p.filter((x) => x !== s.id) : p.concat(s.id) });
        }
      };
    });
    const errs = st.tried ? this.validate() : {};
    const x = {}; const e = {};
    ['services', 'name', 'email', 'date', 'location', 'type', 'guests', 'project'].forEach((k) => { x[k] = !!errs[k]; e[k] = errs[k] || ''; });

    const heroIsGold = st.hero === 'gold';
    const heroOpts = [
      { id: 'gold', label: 'Engraved gold' },
      { id: 'leather', label: 'Foil on leather' }
    ].map((h) => ({
      label: h.label, on: st.hero === h.id,
      cls: st.hero === h.id ? 'opt opt-on' : 'opt',
      pick: () => this.heroTo(h.id)
    }));

    return {
      heroIsGold, heroIsLeather: !heroIsGold, heroOpts,
      heroLetters: 'Ledger & Press'.split('').map((c, i) => ({ c, d: 'animation-delay:' + (0.55 + i * 0.07).toFixed(2) + 's' })),
      pressHero: () => this.heroTo('gold'),
      tiltStyle: 'transform: rotateX(' + (-st.ty * 12).toFixed(2) + 'deg) rotateY(' + (st.tx * 16).toFixed(2) + 'deg)',
      sheenStyle: 'background: radial-gradient(ellipse 70% 90% at ' + (50 + st.tx * 90).toFixed(1) + '% ' + (40 + st.ty * 80).toFixed(1) + '%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%)',
      onTilt: (ev) => {
        const r = ev.currentTarget.getBoundingClientRect();
        if (!r.width || !r.height) return;
        this.setState({ tx: Math.max(-0.5, Math.min(0.5, (ev.clientX - r.left) / r.width - 0.5)), ty: Math.max(-0.5, Math.min(0.5, (ev.clientY - r.top) / r.height - 0.5)) });
      },
      offTilt: () => this.setState({ tx: -0.18, ty: 0.12 }),
      heroGo: st.heroGo ? 'go' : '',
      heroGoldImg: heroIsGold ? 'opacity:1' : 'opacity:0',
      heroLeatherImg: heroIsGold ? 'opacity:0' : 'opacity:1',
      heroAlt: heroIsGold ? 'A white-gloved hand presents a brushed gold card engraved with Ledger and Press, Live Personalization' : 'A white-gloved hand presents a cognac leather square foil stamped in gold with Ledger and Press',
      steps, stepImg, stepNum: roman[st.step],
      book: ['live', 'brand', 'creative'].reduce((o, id) => { o[id] = () => { const p = this.state.picked; if (p.indexOf(id) === -1) this.setState({ picked: p.concat(id) }); }; return o; }, {}),
      nextStep: () => this.setState({ step: (st.step + 1) % 4 }),

      name: st.name,
      displayName: isLogo ? 'Your Logo' : (st.name.trim() || 'Your Name'),
      onName: (ev) => this.setState({ name: ev.target.value.slice(0, 18), go: false, design: st.design === 'logo' ? 'name' : st.design }),
      methods, surfaces, foils, faces, isFoil, designs, isLogo, shapeGlyph,
      hasShape: !!shapeGlyph,
      inkCls: isLogo ? 'ink logo-t' : 'ink',
      surfCls: 'surf surf-' + surface,
      texStyle: 'display:none',
      markCls, goCls,
      plateCls: 'plate ' + (isFoil ? 'foil ' + goCls : ''),
      stageLabel: (isFoil ? (st.foil === 'deboss' ? 'Debossed' : 'Hot foil') : 'Laser') + ' · ' + surfLabel,
      stageAlt: 'Preview of ' + (isLogo ? 'a sample logo' : '"' + (st.name.trim() || 'Your Name') + '"' + (shapeGlyph ? ' with a ' + st.design : '') + ', in the ' + faceName + ' typeface,') + ' ' + (isFoil ? (st.foil === 'deboss' ? 'debossed into ' : 'hot foil stamped in ' + st.foil + ' on ') : 'laser engraved on ') + surfLabel.toLowerCase(),
      play: () => this.replay(),
      playLabel: isFoil ? 'Press it' : 'Engrave it',

      form: st.form, on, services, x, e,
      hasErrors: Object.keys(errs).length > 0,
      sent: st.sent, notSent: !st.sent,
      sending: st.sending, sendFailed: st.sendFailed,
      submitLabel: st.sending ? 'Sending…' : 'Submit inquiry',
      firstName: (st.form.name.trim().split(/\s+/)[0]) || 'friend',
      submit: (ev) => {
        if (ev && ev.preventDefault) ev.preventDefault();
        const errsNow = this.validate();
        const order = [['services', 'f-svc'], ['name', 'f-name'], ['email', 'f-email'], ['date', 'f-date'], ['location', 'f-loc'], ['type', 'f-type'], ['guests', 'f-guests'], ['project', 'f-project']];
        const focusId = (id, sel) => setTimeout(() => { try { let el = document.getElementById(id); if (el && sel) el = el.querySelector(sel); if (el) el.focus(); } catch (err) {} }, 80);
        if (Object.keys(errsNow).length) {
          this.setState({ tried: true });
          const first = order.find((o) => errsNow[o[0]]);
          if (first) focusId(first[1], first[0] === 'services' ? 'input' : null);
          return;
        }
        if (this.state.sending) return;
        const f = this.state.form;
        const labels = { live: 'Live Personalization', brand: 'Event Branding & Production', creative: 'Creative Direction & Fabrication' };
        this.setState({ sending: true, sendFailed: false, tried: false });
        fetch('https://formsubmit.co/ajax/ledgerandpress@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            _subject: 'New inquiry from ' + f.name.trim(),
            _template: 'table',
            _replyto: f.email.trim(),
            'Services': this.state.picked.map((id) => labels[id] || id).join(', '),
            'Name': f.name.trim(),
            'Email': f.email.trim(),
            'Event date': f.date,
            'Location': f.location.trim(),
            'Type of event': f.type.trim(),
            'Guests': f.guests,
            'Anticipated investment': f.budget || 'Not given',
            'Project': f.project.trim()
          })
        }).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((d) => {
          if (d && (d.success === false || d.success === 'false')) throw new Error(d.message || 'failed');
          this.setState({ sending: false, sent: true });
          focusId('sent-h');
        }).catch(() => this.setState({ sending: false, sendFailed: true }));
      },
      reset: () => this.setState({ form: { name: '', email: '', date: '', location: '', type: '', guests: '', budget: '', project: '' }, picked: [], tried: false, sent: false, sending: false, sendFailed: false })
    };
  }
}

window.__bootSite(Component);
</script>
</body>
</html>
